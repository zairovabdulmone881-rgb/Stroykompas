name: Fix URLs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace
        run: |
          find . -type f \( -name "*.html" -o -name "*.xml" -o -name "*.js" \) -not -path "./.git/*" -print0 | xargs -0 sed -i -e 's|https://zairovabdulmone881-rgb.github.io/Stroykompas/|https://stroykompassonline.ru/|g' -e 's|Хасонович|Хасанович|g'
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix urls"
          git push
